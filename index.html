<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/estilo.css">
    <title>Mercado Livro</title>
</head>
<body>
    <header>
        <h1>MercadoLivro</h1>

        <div class="pesquisa">
            <input type="text" name="pesquisa" id="pesquisa" placeholder="Busque um livro ou tecnologia">
            <button type="submit">Buscar</button>
        </div>

        <nav>
            <ul>
                <li><a href="">Crie sua Conta</a></li>
                <li><a href="">Entre</a></li>
                <li><a href="">Compras</a></li>
            </ul>

            <img src="src/assets/carrinho-carrinho.png" alt="Carrinho">

            <div class="darkMode">
                <input type="checkbox" id="dark" class="check">
                <label for="dark" class="theme-label" title="Alternar tema"><img src="./src/assets/darkMode.png"></label>
            </div>
        </nav>
    </header>

    <section class="banner">
        <article class="content-banner">
            <h2>Bem-Vindo(a) ao <br> MercadoLivro</h2>
            <p>Livros, cursos e ferramentas de programaçao, guardados pelos <br> gnomos do bosque</p>
            <button>Ver a coleção</button>
        </article>

        <article class="gnomo1">
            <img src="src/assets/gnomo1" alt="gnomo1">
        </article>

        <article class="gnomo1">
            <img src="src/assets/gnomo2" alt="gnomo2">
        </article>

        <article class="gnomo1">
            <img src="src/assets/gnomo3" alt="gnomo3">
        </article>
    </section>

    <section class="style-cogu"></section>

    <section class="card-destaque">
        <h2>Produtos em destaque</h2>
        <article id="destaque">
            <img id="img-destaque">
        </article>
    
    </section>
    <script src="src/js/script.js"></script>
</body>
</html>
